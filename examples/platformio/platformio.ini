; PlatformIO project for the exip Arduino example, using this checkout as the
; library (library.json at the repository root):
;
;   cd examples/platformio
;   pio run -e due                                  build one board
;   pio run -e due -t upload && pio device monitor  run it
;
; exipConfig.h selects include/exip_arduino_config.h for Arduino builds; override single
; settings with build_flags, e.g. -DEXIP_DEBUG=ON (then provide exip_debug_printf, see the
; sketch).

[platformio]
src_dir = ../arduino/ExipRoundTrip

[env]
framework = arduino
lib_deps = symlink://../..
monitor_speed = 115200

; Arduino Due (SAM3X8E, Cortex-M3)
[env:due]
platform = atmelsam
board = due

; Arduino Nano 33 BLE (nRF52840, Cortex-M4F)
[env:nano33ble]
platform = nordicnrf52
board = nano33ble

; Raspberry Pi Pico (RP2040, Cortex-M0+)
[env:pico]
platform = raspberrypi
board = pico

; ESP32 DevKit (Xtensa LX6)
[env:esp32dev]
platform = espressif32
board = esp32dev
