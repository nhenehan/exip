name: portability

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  pc-linux:
    name: pc profile (linux + tests)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build cmake check

      - name: Configure
        run: cmake -S . -B build-pc-ci -G Ninja -DEXIP_PLATFORM_PROFILE=pc

      - name: Build
        run: cmake --build build-pc-ci

      - name: Test
        run: ctest --test-dir build-pc-ci --output-on-failure

  mingw-cross:
    name: mingw profile (cross-build + smoke)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build cmake mingw-w64

      - name: Configure
        run: >-
          cmake -S . -B build-mingw-ci -G Ninja
          -DCMAKE_TOOLCHAIN_FILE=cmake/toolchains/mingw-w64-x86_64.cmake
          -DEXIP_PLATFORM_PROFILE=mingw
          -DEXIP_HARDENING=OFF

      - name: Build
        run: cmake --build build-mingw-ci

      - name: Verify Windows binaries
        run: |
          file build-mingw-ci/examples/simpleEncoding/exipe.exe
          file build-mingw-ci/examples/simpleDecoding/exipd.exe
          file build-mingw-ci/utils/schemaHandling/exipg.exe

      - name: Smoke
        run: ctest --test-dir build-mingw-ci -L smoke --output-on-failure

  contiki-profile:
    name: contiki profile (examples + smoke)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build cmake

      - name: Configure
        run: >-
          cmake -S . -B build-contiki-ci -G Ninja
          -DEXIP_PLATFORM_PROFILE=contiki
          -DEXIP_HARDENING=OFF

      - name: Build
        run: cmake --build build-contiki-ci

      - name: Smoke
        run: ctest --test-dir build-contiki-ci -L smoke --output-on-failure

  riot-profile:
    name: riot profile (examples + smoke)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build cmake

      - name: Configure
        run: >-
          cmake -S . -B build-riot-ci -G Ninja
          -DEXIP_PLATFORM_PROFILE=riot
          -DEXIP_HARDENING=OFF

      - name: Build
        run: cmake --build build-riot-ci

      - name: Smoke
        run: ctest --test-dir build-riot-ci -L smoke --output-on-failure
