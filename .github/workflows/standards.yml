name: standards

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  standards-conformance:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build cmake check maven

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # gcc-release preset into build/, where the interop tests look for exipg and exipd
      - name: Configure CMake (gcc-release preset)
        run: |
          cmake --preset gcc-release -B build -G Ninja

      - name: Build required EXIP tools
        run: |
          cmake --build build --target exipg exipd -j4

      # The interop tests run xsd2exip with exec:java, which does not compile it
      - name: Compile xsd2exip
        working-directory: utils/xsd2exip
        run: |
          mvn -q -DskipTests compile

      - name: Compile interop-tests
        working-directory: interop-tests
        run: |
          mvn -q -DskipTests test-compile

      - name: Run standards generation + conformance tests
        working-directory: interop-tests
        run: |
          mvn -q -Dtest=StandardsGenerationPipelineTest,StandardsConformanceProfileTest test

      - name: Generate standards markdown summary
        if: always()
        run: |
          set -e
          mkdir -p interop-tests/target
          REPORT=interop-tests/target/standards-conformance-latest.md

          {
            echo "# Standards Conformance Summary"
            echo
            echo "- Workflow: standards"
            echo "- Timestamp (UTC): $(date -u +"%Y-%m-%dT%H:%M:%SZ")"
            echo
            echo "## Test Targets"
            echo "- StandardsGenerationPipelineTest"
            echo "- StandardsConformanceProfileTest"
            echo
          } > "$REPORT"

          if ls interop-tests/target/surefire-reports/*.xml >/dev/null 2>&1; then
            TESTS=$(grep -h "<testsuite" interop-tests/target/surefire-reports/*.xml | sed -n 's/.*tests="\([0-9]*\)".*/\1/p' | awk '{s+=$1} END {print s+0}')
            FAILURES=$(grep -h "<testsuite" interop-tests/target/surefire-reports/*.xml | sed -n 's/.*failures="\([0-9]*\)".*/\1/p' | awk '{s+=$1} END {print s+0}')
            ERRORS=$(grep -h "<testsuite" interop-tests/target/surefire-reports/*.xml | sed -n 's/.*errors="\([0-9]*\)".*/\1/p' | awk '{s+=$1} END {print s+0}')
            SKIPPED=$(grep -h "<testsuite" interop-tests/target/surefire-reports/*.xml | sed -n 's/.*skipped="\([0-9]*\)".*/\1/p' | awk '{s+=$1} END {print s+0}')

            {
              echo "## Aggregated Result"
              echo "- Tests: $TESTS"
              echo "- Failures: $FAILURES"
              echo "- Errors: $ERRORS"
              echo "- Skipped: $SKIPPED"
              echo
            } >> "$REPORT"
          else
            {
              echo "## Aggregated Result"
              echo "No surefire XML reports were found."
              echo
            } >> "$REPORT"
          fi

          {
            echo "## Artifacts"
            echo "- interop-tests/target/standards-artifacts/"
            echo "- interop-tests/target/surefire-reports/"
          } >> "$REPORT"

      - name: Upload standards summary artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: standards-summary
          path: |
            interop-tests/target/standards-conformance-latest.md
            interop-tests/target/surefire-reports/**
            interop-tests/target/standards-artifacts/**
          if-no-files-found: warn
